limit_req_zone $binary_remote_addr zone=lobbyops:10m rate=10r/s;

log_format lobbyops '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                   'rid=$http_x_request_id up_rid=$upstream_http_x_request_id';

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/lobbyops.access.log lobbyops;
    error_log  /var/log/nginx/lobbyops.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;
    add_header Referrer-Policy           "no-referrer"                          always;
    add_header Content-Security-Policy   "default-src 'none'"                   always;

    limit_req        zone=lobbyops burst=20 nodelay;
    limit_req_status 429;

    # Restrict /valet/* to the 1Valet portal -- no other origin may call these endpoints.
    location ~ ^/valet/ {
        if ($http_origin != "https://my.1valetbas.com") {
            return 403;
        }
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://127.0.0.1:5002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
