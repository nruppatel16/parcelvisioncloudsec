<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="LobbyOps full request cycle animation">
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; }
    .dim { fill: #484f58; }
    .lo  { fill: #6e7681; }
    .mob { fill: #58a6ff; }
    .ngx { fill: #f0883e; }
    .ocr { fill: #ffa657; }
    .sht { fill: #3fb950; }
    .que { fill: #79c0ff; }
    .jss { fill: #d2a8ff; }
    .don { fill: #56d364; }
    .val { fill: #c9d1d9; }
    .hlt { fill: #e6edf3; }
    @keyframes a    { from { opacity: 0 } to { opacity: 1 } }
    @keyframes blnk { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes bar  { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .ln  { opacity: 0; animation: a 0.3s ease forwards; }
    .cur { fill: #58a6ff; animation: blnk 1s step-end infinite; }
    .pb  { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: bar 11.5s linear forwards 0.5s; }
  </style>

  <rect width="900" height="440" rx="8" fill="#0d1117"/>
  <rect width="900" height="32" rx="8" fill="#161b22"/>
  <rect y="24" width="900" height="8" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#28ca42"/>
  <text x="450" y="21" text-anchor="middle" fill="#8b949e" font-size="12"
        font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">LobbyOps &#x2014; full request cycle &#xB7; G2 &#xB7; photo to portal entry</text>

  <rect x="20" y="422" width="860" height="3" rx="1.5" fill="#21262d"/>
  <rect x="20" y="422" width="860" height="3" rx="1.5" fill="#1f6feb" class="pb"/>

  <text y="57" class="ln" style="animation-delay:0.5s">
    <tspan x="20" class="dim">[08:14:32] </tspan><tspan class="lo">server  &#x25B8; </tspan><tspan class="val">Flask ready &#xB7; gunicorn 2 workers &#xB7; port </tspan><tspan class="hlt">5002</tspan>
  </text>
  <text y="79" class="ln" style="animation-delay:1.5s">
    <tspan x="20" class="dim">[08:14:45] </tspan><tspan class="mob">mobile  &#x25B8; </tspan><tspan class="val">POST /upload  building=</tspan><tspan class="hlt">G2</tspan><tspan class="val">  size=2.1 MB  job_id=</tspan><tspan class="hlt">f4a3c8bb</tspan>
  </text>
  <text y="101" class="ln" style="animation-delay:2.0s">
    <tspan x="20" class="dim">[08:14:45] </tspan><tspan class="ngx">nginx   &#x25B8; </tspan><tspan class="val">202 Accepted &#x2192; proxying to gunicorn </tspan><tspan class="hlt">127.0.0.1:5002</tspan>
  </text>
  <text y="123" class="ln" style="animation-delay:2.5s">
    <tspan x="20" class="dim">[08:14:45] </tspan><tspan class="ocr">ocr     &#x25B8; </tspan><tspan class="val">preprocessing &#xB7; upscale 2x &#xB7; denoise (NL means) &#xB7; CLAHE &#xB7; sharpen</tspan>
  </text>
  <text y="145" class="ln" style="animation-delay:3.2s">
    <tspan x="20" class="dim">[08:14:46] </tspan><tspan class="ocr">ocr     &#x25B8; </tspan><tspan class="val">sending to </tspan><tspan class="hlt">Gemini 2.5 Flash</tspan><tspan class="val">...</tspan>
  </text>
  <text y="167" class="ln" style="animation-delay:5.5s">
    <tspan x="20" class="dim">[08:14:47] </tspan><tspan class="ocr">ocr     &#x25B8; </tspan><tspan class="hlt">unit=2401</tspan><tspan class="val">  name=&#x22;Sarah Chen&#x22;  supplier=</tspan><tspan class="hlt">Amazon</tspan><tspan class="val">  confidence=</tspan><tspan class="don">high</tspan>
  </text>
  <text y="189" class="ln" style="animation-delay:6.0s">
    <tspan x="20" class="dim">[08:14:47] </tspan><tspan class="sht">sheets  &#x25B8; </tspan><tspan class="val">appending to G2 sheet &#xB7; attempt 1/3 &#xB7; </tspan><tspan class="sht">row 148 written</tspan>
  </text>
  <text y="211" class="ln" style="animation-delay:6.5s">
    <tspan x="20" class="dim">[08:14:47] </tspan><tspan class="que">queue   &#x25B8; </tspan><tspan class="val">INSERT id=</tspan><tspan class="hlt">892</tspan><tspan class="val">  building=</tspan><tspan class="hlt">G2</tspan><tspan class="val">  unit=</tspan><tspan class="hlt">2401</tspan><tspan class="val">  status=</tspan><tspan class="hlt">pending</tspan>
  </text>
  <text y="233" class="ln" style="animation-delay:7.5s">
    <tspan x="20" class="dim">[08:14:50] </tspan><tspan class="jss">js      &#x25B8; </tspan><tspan class="val">GET /valet/pending?building=G2 &#x2192; </tspan><tspan class="lo">[] &#xB7; polling again in 5s</tspan>
  </text>
  <text y="255" class="ln" style="animation-delay:8.5s">
    <tspan x="20" class="dim">[08:14:55] </tspan><tspan class="jss">js      &#x25B8; </tspan><tspan class="val">GET /valet/pending?building=G2 &#x2192; </tspan><tspan class="hlt">[{unit: &#x22;2401&#x22;, name: &#x22;Sarah Chen&#x22;}]</tspan>
  </text>
  <text y="277" class="ln" style="animation-delay:9.0s">
    <tspan x="20" class="dim">[08:14:55] </tspan><tspan class="jss">js      &#x25B8; </tspan><tspan class="val">addUnit(&#x22;</tspan><tspan class="hlt">2401</tspan><tspan class="val">&#x22;) &#xB7; typing 2&#xB7;4&#xB7;0&#xB7;1 into suite input (50 ms/char)</tspan>
  </text>
  <text y="299" class="ln" style="animation-delay:10.0s">
    <tspan x="20" class="dim">[08:14:57] </tspan><tspan class="jss">js      &#x25B8; </tspan><tspan class="val">dropdown match found &#xB7; </tspan><tspan class="hlt">clicking &#x22;2401 Sarah Chen&#x22;</tspan><tspan class="val"> &#xB7; settle 1s</tspan>
  </text>
  <text y="321" class="ln" style="animation-delay:10.5s">
    <tspan x="20" class="dim">[08:14:57] </tspan><tspan class="jss">js      &#x25B8; </tspan><tspan class="val">POST /valet/complete {unit: &#x22;2401&#x22;, success: true} &#x2192; </tspan><tspan class="sht">200 OK</tspan>
  </text>
  <text y="343" class="ln" style="animation-delay:11.0s">
    <tspan x="20" class="dim">[08:14:57] </tspan><tspan class="que">queue   &#x25B8; </tspan><tspan class="val">UPDATE status=</tspan><tspan class="don">complete</tspan><tspan class="val">  completed_at=08:14:57  elapsed=</tspan><tspan class="hlt">7.4s</tspan>
  </text>
  <text y="365" class="ln" style="animation-delay:11.5s">
    <tspan x="20" class="dim">[08:14:57] </tspan><tspan class="don">done    &#x25B8; </tspan><tspan class="don">photo &#x2192; OCR &#x2192; Sheets &#x2192; queue &#x2192; 1Valet &#xB7; total 7.4 seconds</tspan>
  </text>
  <text y="387" class="ln" style="animation-delay:11.8s">
    <tspan x="20" class="dim">$ </tspan><tspan class="cur">&#x2587;</tspan>
  </text>
</svg>
